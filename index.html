<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kirana Ledger – Smart Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3ECDD;--card:#FBF7EE;--ink:#1E1B16;--mut:#7A7266;--line:#E0D5BF;--red:#C2412D;--gold:#E3A018;--green:#2E6B4E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120E;--card:#201C16;--ink:#F3ECDD;--mut:#A39A8A;--line:#383025;--red:#FF7A63;--green:#6FCF9F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15120E;--card:#201C16;--ink:#F3ECDD;--mut:#A39A8A;--line:#383025;--red:#FF7A63;--green:#6FCF9F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg) radial-gradient(var(--line) 1px,transparent 1px) 0 0/24px 24px;color:var(--ink);font:15px/1.5 'Manrope',system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.brand{font-family:'Fraunces',Georgia,serif;font-weight:800;letter-spacing:-.02em}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1}h2{font-size:24px;margin-bottom:6px}h3{font-size:18px;margin-bottom:12px}
a{color:inherit}.mu{color:var(--mut)}.cr{color:var(--red)}.pm{color:var(--green)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:16px;padding:12px 22px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:20px}
.brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--gold);color:#1E1B16;font-style:normal;transition:transform .4s}.brand:hover i{transform:rotate(-12deg) scale(1.1)}
.nl{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.nl a{padding:7px 13px;border-radius:99px;color:var(--mut);text-decoration:none;font-weight:600;white-space:nowrap;transition:.2s}.nl a:hover{color:var(--ink)}.nl a.on{background:var(--ink);color:var(--bg)}
main{max-width:1080px;margin:0 auto;padding:28px 22px 70px}
.pg>*{animation:up .6s both cubic-bezier(.2,.7,.2,1)}.pg>*+*{margin-top:16px}
.pg>:nth-child(2){animation-delay:.07s}.pg>:nth-child(3){animation-delay:.14s}.pg>:nth-child(4){animation-delay:.21s}.pg>:nth-child(n+5){animation-delay:.28s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}@keyframes fi{from{opacity:0}}
.cd{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.st{transition:transform .25s,box-shadow .25s}.st:hover{transform:translateY(-4px);box-shadow:0 12px 24px #0002}
.st .v{font-family:'Fraunces',Georgia,serif;font-size:32px;font-weight:800}
.st.a{background:var(--ink);color:var(--bg)}.st.a .mu{color:inherit;opacity:.7}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.end{justify-content:flex-end;margin-top:18px}
.b{display:inline-block;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);text-decoration:none;transition:transform .15s,opacity .2s}
.b:hover{transform:translateY(-2px)}.b:active{transform:none}.b.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.b.y{background:var(--gold);color:#1E1B16}.b.r{background:#C2412D;color:#fff}.sm{padding:6px 11px;font-size:13px}
input,select{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.06em}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}tr:hover td{background:color-mix(in srgb,var(--gold) 9%,transparent)}.ac{text-align:right}
.nm{font-weight:800;text-decoration:none}.nm:hover{text-decoration:underline}
.ch{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;display:inline-block}
.ch.g{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}.ch.r{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}.ch.y{background:color-mix(in srgb,var(--gold) 28%,transparent);color:var(--ink)}
.ar{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.ar:last-child{border:0}.ar>div{flex:1;min-width:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#1E1B16;display:grid;place-items:center;font-weight:800;flex:none}
.sup{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.sup .cd{transition:transform .25s}.sup .cd:hover{transform:translateY(-4px)}
.lg{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;max-width:1080px;margin:0 auto;padding:50px 22px}
.lg h1{font-size:clamp(42px,7vw,80px);margin:22px 0 14px;animation:up .8s both}.lead{max-width:430px;font-size:17px;color:var(--mut);animation:up .8s .15s both}
em{font-style:normal;background:linear-gradient(var(--gold),var(--gold)) 0 90%/0 36% no-repeat;animation:hl 1s .6s forwards}@keyframes hl{to{background-size:100% 36%}}
.paper{margin-top:34px;max-width:340px;padding:0 20px 0 56px;border-radius:14px;border:1px solid var(--line);position:relative;background:var(--card) repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px);transform:rotate(-2.5deg);animation:fl 5s ease-in-out infinite;box-shadow:0 20px 40px #0002}
.paper::before{content:"";position:absolute;left:40px;top:0;bottom:0;width:2px;background:var(--red);opacity:.6}
.paper>div{height:34px;display:flex;justify-content:space-between;align-items:center;font-weight:600}.paper b{font-family:'Fraunces',serif}
@keyframes fl{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(-1.5deg) translateY(-10px)}}
.au{animation:up .8s .2s both;padding:28px}
.mo{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px;animation:fi .2s}.mo[hidden]{display:none}
.mb{width:100%;max-width:440px;max-height:90vh;overflow:auto;animation:up .35s both}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:#C2412D;color:#fff}
.b1{fill:var(--red)}.b2{fill:var(--green)}.tx{fill:var(--mut);font-size:12px;font-family:'Manrope',sans-serif}.gl{stroke:var(--line);stroke-width:2}
svg rect{transform-box:fill-box;transform-origin:bottom;animation:gr .8s both cubic-bezier(.2,.7,.2,1)}@keyframes gr{from{transform:scaleY(0)}}
.lk{max-width:360px;margin:12vh auto 0;text-align:center}
@media (max-width:760px){.lg,.two2{grid-template-columns:1fr}.nl{order:3;flex-basis:100%}.paper{margin-inline:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{html:root:not([data-theme]),html:root[data-theme]{--bg:#fff;--card:#fff;--ink:#000;--mut:#555;--line:#ccc;--red:#b00;--green:#060}.top,.noprint,#toast{display:none!important}body{background:#fff}}
</style></head>
<body><div id="app"></div><div id="modal" class="mo" hidden></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN'),DAY=864e5,uid=()=>Math.random().toString(36).slice(2,8);
const dt=t=>new Date(t).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const sd=t=>new Date(t).toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
let db,unlocked=false,mode='in',F={type:'all',from:'',to:'',q:''},R={p:'daily'};
function seed(){
 const C=[['c1','Ramesh Gaikwad','9822011101'],['c2','Sunita Jadhav','9850022202'],['c3','Anil Kulkarni','9763033303'],['c4','Meena Shinde','9922044404'],['c5','Farida Shaikh','9890055505'],['c6','Vijay More','9921066606']];
 const T=[['c1','credit',1850,'Monthly ration',150],['c1','payment',1000,'Cash',140],['c1','credit',920,'Oil, dal',95],['c1','payment',800,'UPI',80],['c1','credit',640,'Weekly items',30],['c1','credit',410,'Tea, sugar',6],['c2','credit',2300,'Festival stock',120],['c2','payment',2300,'Cleared in full',100],['c2','credit',760,'Groceries',45],['c2','payment',300,'Cash',20],['c2','credit',520,'Rice, atta',3],['c3','credit',1200,'Groceries',70],['c3','credit',480,'Snacks',33],['c3','payment',500,'UPI',10],['c4','credit',3100,'Wedding order',60],['c4','payment',1500,'UPI',40],['c4','credit',350,'Milk, bread',2],['c5','credit',990,'Monthly ration',25],['c5','payment',990,'Cash',8],['c6','credit',1430,'Groceries',12],['c6','credit',260,'Biscuits',0]];
 return{user:{name:'Suresh Patil',email:'demo@kirana.in',pass:'demo123'},shop:'Patil Kirana Store',theme:'',pin:'',in:false,
 customers:C.map(c=>({id:c[0],name:c[1],phone:c[2]})),
 tx:T.map((t,i)=>({id:'t'+i,cid:t[0],type:t[1],amt:t[2],note:t[3],ts:Date.now()-t[4]*DAY-(i%7)*9e5})),
 sup:[{id:'s1',name:'Mahesh Deshmukh',phone:'9890012345',biz:'Mahesh Wholesale Foods',addr:'Market Yard, Pune'},{id:'s2',name:'Rohit Agarwal',phone:'9822098765',biz:'Agarwal Oil & Dal Traders',addr:'Bhosari, Pimpri-Chinchwad'},{id:'s3',name:'Kavita Joshi',phone:'9765043210',biz:'Joshi Dairy Supplies',addr:'Chinchwad, Pune'}]};
}
try{db=JSON.parse(localStorage.getItem('kl'))}catch(e){}
if(!db||!db.customers)db=seed();
const save=()=>{try{localStorage.setItem('kl',JSON.stringify(db))}catch(e){}};
const applyTheme=()=>{if(db.theme)document.documentElement.dataset.theme=db.theme;else delete document.documentElement.dataset.theme};applyTheme();
const cust=id=>db.customers.find(c=>c.id===id),nm=id=>cust(id)?cust(id).name:'Deleted customer';
const cs=(id,ty)=>db.tx.filter(t=>t.cid===id&&t.type===ty).reduce((s,t)=>s+t.amt,0);
const bal=id=>Math.round((cs(id,'credit')-cs(id,'payment'))*100)/100;
const st=id=>bal(id)<=0?['Paid','g']:cs(id,'payment')>0?['Partially Paid','y']:['Pending','r'];
const sum=ty=>db.tx.filter(t=>t.type===ty).reduce((s,t)=>s+t.amt,0);
const opts=sel=>db.customers.map(c=>`<option value="${c.id}"${c.id===sel?' selected':''}>${esc(c.name)}</option>`).join('');
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(t.h);t.h=setTimeout(()=>t.className='',2600)}
function openModal(t,h){const m=$('#modal');m.innerHTML=`<div class="mb cd" data-form><h2>${t}</h2>${h}</div>`;m.hidden=false;const i=m.querySelector('input');if(i)i.focus()}
const closeM=()=>{$('#modal').hidden=true};
function tx(cid,type,amt,note){if(!cust(cid))return'Select a customer';if(!(amt>0)||!isFinite(amt))return'Enter a valid amount';amt=Math.round(amt*100)/100;if(type==='payment'&&amt>bal(cid))return'Payment exceeds the due of '+inr(Math.max(bal(cid),0));db.tx.push({id:uid(),cid,type,amt,note,ts:Date.now()});save();return''}
const chip=t=>`<span class="ch ${t==='credit'?'r':'g'}">${t==='credit'?'Udhar':'Payment'}</span>`;
const amtc=t=>`<td class="${t.type==='credit'?'cr':'pm'}"><b>${t.type==='credit'?'+':'−'}${inr(t.amt)}</b></td>`;
const txT=(L,n)=>L.length?`<div class="sc"><table><tr><th>Date</th>${n?'<th>Customer</th>':''}<th>Note</th><th>Type</th><th>Amount</th></tr>${L.map(t=>`<tr><td>${dt(t.ts)}</td>${n?`<td><a class="nm" href="#customer-${t.cid}">${esc(nm(t.cid))}</a></td>`:''}<td>${esc(t.note||'—')}</td><td>${chip(t.type)}</td>${amtc(t)}</tr>`).join('')}</table></div>`:'<p class="mu">No transactions found.</p>';
const stat=(l,v,c,k)=>`<div class="cd st ${k||''}"><span class="mu">${l}</span><div class="v" data-n="${v}" data-c="${c?1:0}">0</div></div>`;
const ef=cid=>!db.customers.length?'<p class="mu">Add a customer first.</p>':`<div data-form>${cid?'':`<label>Customer</label><select id="ec">${opts()}</select>`}<div class="two"><div><label>Type</label><select id="et"><option value="credit">Udhar (credit given)</option><option value="payment">Payment received</option></select></div><div><label>Amount (₹)</label><input id="ea" type="number" min="1" step="0.01" inputmode="decimal"></div></div><label>Note</label><input id="en" placeholder="e.g. Rice, dal, oil"><div class="row end"><button class="b y" data-primary data-act="addTx" data-id="${cid||''}">Save entry</button></div></div>`;
const NAV=[['dashboard','Dashboard'],['customers','Customers'],['khata','Khata'],['payments','Payments'],['reports','Reports'],['analytics','Analytics'],['suppliers','Suppliers'],['settings','Settings']];
const nav=h=>`<header class="top noprint"><a class="brand" href="#dashboard"><i>₹</i>Kirana Ledger</a><nav class="nl">${NAV.map(n=>`<a href="#${n[0]}" class="${h===n[0]||(n[0]==='customers'&&h.startsWith('customer-'))?'on':''}">${n[1]}</a>`).join('')}</nav><button class="b g sm" data-act="theme" aria-label="Toggle light or dark mode">◐</button></header>`;

function pLogin(){const r=mode==='reg';return`<div class="lg"><section><a class="brand" href="#login"><i>₹</i>Kirana Ledger</a><h1>Udhar likho.<br><em>Hisaab</em> rakho.</h1><p class="lead">The smart khata that turns your dusty credit register into a clean, searchable, shareable ledger.</p><div class="paper"><div><b>Smart Khata</b><span class="mu">Today</span></div><div><span>Sunita J.</span><span class="cr">+ ₹520</span></div><div><span>Anil K.</span><span class="pm">− ₹500</span></div><div><span>Vijay M.</span><span class="cr">+ ₹260</span></div></div></section>
<section class="cd au" data-form><h2>${r?'Create your shop account':'Welcome back'}</h2><p class="mu">${r?'Registering starts a fresh, empty ledger.':'Log in to open your khata.'}</p>
${r?'<label>Owner name</label><input id="rn" autocomplete="name"><label>Shop name</label><input id="rs">':''}
<label>Email</label><input id="li" type="email" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="${r?'new-password':'current-password'}">
<div class="row end" style="justify-content:space-between"><button class="b g" data-act="mode">${r?'I have an account':'New shop? Register'}</button><button class="b y" data-primary data-act="${r?'reg':'login'}">${r?'Register':'Log in'}</button></div>
${r?'':'<p class="mu" style="margin-top:16px">Demo: demo@kirana.in / demo123 — <a href="#login" data-act="demo" style="font-weight:800">fill it in</a></p>'}</section></div>`}
const pLock=()=>`<div class="lk cd" data-form><h2>Enter PIN</h2><p class="mu">Your khata is protected.</p><input id="up" type="password" inputmode="numeric" maxlength="4" style="text-align:center;font-size:24px;letter-spacing:.4em;margin-top:14px"><div class="row end" style="justify-content:center"><button class="b y" data-primary data-act="unlock">Unlock</button></div></div>`;
function actRow(t){return`<div class="ar"><div class="av">${esc(nm(t.cid)[0])}</div><div><a class="nm" href="#customer-${t.cid}">${esc(nm(t.cid))}</a><div class="mu">${esc(t.note||'—')} · ${dt(t.ts)}</div></div><b class="${t.type==='credit'?'cr':'pm'}">${t.type==='credit'?'+':'−'}${inr(t.amt)}</b></div>`}
function pDash(){const out=db.customers.reduce((s,c)=>s+Math.max(bal(c.id),0),0),td=db.tx.filter(t=>new Date(t.ts).toDateString()===new Date().toDateString()).length,h=new Date().getHours(),R6=[...db.tx].sort((a,b)=>b.ts-a.ts).slice(0,6);
return`<div class="hd"><div><p class="mu">${h<12?'Good morning':h<17?'Good afternoon':'Good evening'}, ${esc(db.user.name.split(' ')[0])}</p><h1>${esc(db.shop)}</h1></div></div>
<div class="grid">${stat('Outstanding credit',out,1,'a')}${stat('Payments received',sum('payment'),1)}${stat('Customers',db.customers.length)}${stat('Today’s transactions',td)}</div>
<div class="cd"><h3>Quick actions</h3><div class="row"><button class="b y" data-act="addCust">+ Add customer</button><a class="b" href="#khata">Give udhar</a><a class="b" href="#payments">Receive payment</a><a class="b g" href="#reports">View reports</a></div></div>
<div class="cd"><h3>Recent activity</h3>${R6.length?R6.map(actRow).join(''):'<p class="mu">No activity yet.</p>'}</div>`}
function custTable(q){q=q.toLowerCase();const L=db.customers.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q));if(!L.length)return'<p class="mu" style="padding:14px 0">No customers found.</p>';
return`<table><tr><th>Name</th><th>Mobile</th><th>Outstanding</th><th>Status</th><th></th></tr>${L.map(c=>{const s=st(c.id);return`<tr><td><a class="nm" href="#customer-${c.id}">${esc(c.name)}</a></td><td>${c.phone}</td><td class="${bal(c.id)>0?'cr':'pm'}"><b>${inr(Math.max(bal(c.id),0))}</b></td><td><span class="ch ${s[1]}">${s[0]}</span></td><td class="ac"><a class="b g sm" href="#customer-${c.id}">View</a> <button class="b g sm" data-act="editCust" data-id="${c.id}">Edit</button> <button class="b g sm" data-act="delCust" data-id="${c.id}">Delete</button></td></tr>`}).join('')}</table>`}
const pCust=()=>`<div class="hd"><h1>Customers</h1><button class="b y" data-act="addCust">+ Add customer</button></div><div class="cd"><input data-q placeholder="Search by name or mobile number"><div id="cl" class="sc">${custTable('')}</div></div>`;
function pProf(id){const c=cust(id);if(!c)return`<div class="cd"><h2>Customer not found</h2><a class="b" href="#customers">Back to customers</a></div>`;
const bl=bal(id),s=st(id);let run=0;const rows=db.tx.filter(t=>t.cid===id).sort((a,b)=>a.ts-b.ts).map(t=>{run+=t.type==='credit'?t.amt:-t.amt;return{...t,run}}).reverse();
const msg=`Namaste ${c.name}, your khata balance at ${db.shop} is ${inr(Math.max(bl,0))}.`+rows.slice(0,5).map(t=>`\n${sd(t.ts)}: ${t.type==='credit'?'Udhar':'Paid'} ${inr(t.amt)}`).join('')+`\nThank you!`;
return`<div class="hd"><div><a class="mu noprint" href="#customers">← All customers</a><h1>${esc(c.name)}</h1><p class="mu">${c.phone}</p></div><div class="row noprint"><button class="b g" data-act="editCust" data-id="${id}">Edit</button><button class="b g" data-act="delCust" data-id="${id}">Delete</button><button class="b" data-act="print">Print / Save PDF</button><a class="b y" target="_blank" rel="noopener" href="https://wa.me/91${c.phone}?text=${encodeURIComponent(msg)}">Share on WhatsApp</a></div></div>
<div class="grid">${stat('Outstanding',Math.max(bl,0),1,'a')}${stat('Total udhar',cs(id,'credit'),1)}${stat('Total paid',cs(id,'payment'),1)}<div class="cd st"><span class="mu">Status</span><div style="margin-top:12px"><span class="ch ${s[1]}">${s[0]}</span></div></div></div>
<div class="cd noprint"><h3>New entry</h3>${ef(id)}</div>
<div class="cd"><h3>Ledger</h3>${rows.length?`<div class="sc"><table><tr><th>Date</th><th>Note</th><th>Type</th><th>Amount</th><th>Balance</th></tr>${rows.map(t=>`<tr><td>${dt(t.ts)}</td><td>${esc(t.note||'—')}</td><td>${chip(t.type)}</td>${amtc(t)}<td><b>${inr(t.run)}</b></td></tr>`).join('')}</table></div>`:'<p class="mu">No entries yet.</p>'}</div>`}
function kList(){let L=[...db.tx].sort((a,b)=>b.ts-a.ts);if(F.type!=='all')L=L.filter(t=>t.type===F.type);if(F.from)L=L.filter(t=>t.ts>=+new Date(F.from+'T00:00:00'));if(F.to)L=L.filter(t=>t.ts<=+new Date(F.to+'T23:59:59.999'));if(F.q)L=L.filter(t=>nm(t.cid).toLowerCase().includes(F.q.toLowerCase()));return`<p class="mu" style="margin-bottom:8px">${L.length} record${L.length===1?'':'s'}</p>`+txT(L,1)}
const pKhata=()=>`<div class="hd"><h1>Digital Khata</h1></div><div class="cd"><h3>Record udhar or payment</h3>${ef('')}</div><div class="cd"><h3>Transaction history</h3><div class="two2" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px"><div><label>Type</label><select data-f="type"><option value="all">All</option><option value="credit"${F.type==='credit'?' selected':''}>Credit (udhar)</option><option value="payment"${F.type==='payment'?' selected':''}>Payment</option></select></div><div><label>From</label><input type="date" data-f="from" value="${F.from}"></div><div><label>To</label><input type="date" data-f="to" value="${F.to}"></div><div><label>Customer</label><input data-f="q" placeholder="Name" value="${esc(F.q)}"></div></div><div id="kl">${kList()}</div></div>`;
function pPay(){const L=db.tx.filter(t=>t.type==='payment').sort((a,b)=>b.ts-a.ts).slice(0,12);
return`<div class="hd"><h1>Payments</h1></div><div class="two2"><div class="cd" data-form><h3>Record a payment</h3>${db.customers.length?`<label>Customer</label><select id="pc">${opts()}</select><p class="mu" style="margin-top:8px">Current due: <b id="pdue">${inr(Math.max(bal(db.customers[0].id),0))}</b></p><label>Amount (₹)</label><input id="pa" type="number" min="1" step="0.01" inputmode="decimal"><label>Note</label><input id="pn" placeholder="Cash / UPI"><div class="row end"><button class="b g" data-act="settle">Settle full due</button><button class="b y" data-primary data-act="pay">Record payment</button></div>`:'<p class="mu">Add a customer first.</p>'}</div>
<div class="cd"><h3>Dues &amp; status</h3><div class="sc"><table><tr><th>Customer</th><th>Due</th><th>Status</th></tr>${db.customers.map(c=>{const s=st(c.id);return`<tr><td><a class="nm" href="#customer-${c.id}">${esc(c.name)}</a></td><td><b>${inr(Math.max(bal(c.id),0))}</b></td><td><span class="ch ${s[1]}">${s[0]}</span></td></tr>`}).join('')}</table></div></div></div><div class="cd"><h3>Payment history</h3>${txT(L,1)}</div>`}
function pRep(){const n=new Date(),s=R.p==='daily'?new Date(n.getFullYear(),n.getMonth(),n.getDate()):R.p==='weekly'?new Date(+n-7*DAY):new Date(n.getFullYear(),n.getMonth(),1);
const L=db.tx.filter(t=>t.ts>=+s).sort((a,b)=>b.ts-a.ts),c=L.filter(t=>t.type==='credit').reduce((x,t)=>x+t.amt,0),p=L.filter(t=>t.type==='payment').reduce((x,t)=>x+t.amt,0),due=db.customers.filter(x=>bal(x.id)>0).sort((a,b)=>bal(b.id)-bal(a.id));
const o=(v,l)=>`<option value="${v}"${R.p===v?' selected':''}>${l}</option>`;
return`<div class="hd"><h1>Reports</h1><div class="row noprint"><select data-r style="width:auto">${o('daily','Daily (today)')}${o('weekly','Weekly (last 7 days)')}${o('monthly','Monthly (this month)')}</select><button class="b" data-act="print">Print / Save PDF</button></div></div>
<div class="grid">${stat('Credit given',c,1,'a')}${stat('Payments received',p,1)}${stat('Net change in dues',Math.abs(c-p),1)}${stat('Transactions',L.length)}</div>
<div class="cd"><h3>Transactions in this period</h3>${txT(L,1)}</div>
<div class="cd"><h3>Outstanding dues report</h3>${due.length?`<div class="sc"><table><tr><th>Customer</th><th>Mobile</th><th>Due</th></tr>${due.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.phone}</td><td class="cr"><b>${inr(bal(x.id))}</b></td></tr>`).join('')}<tr><td colspan="2"><b>Total</b></td><td class="cr"><b>${inr(due.reduce((a,x)=>a+bal(x.id),0))}</b></td></tr></table></div>`:'<p class="mu">No dues. Everyone is settled!</p>'}</div>
<div class="cd"><h3>Customer-wise financial report</h3><div class="sc"><table><tr><th>Customer</th><th>Udhar</th><th>Paid</th><th>Balance</th></tr>${db.customers.map(x=>`<tr><td>${esc(x.name)}</td><td>${inr(cs(x.id,'credit'))}</td><td>${inr(cs(x.id,'payment'))}</td><td><b>${inr(Math.max(bal(x.id),0))}</b></td></tr>`).join('')}</table></div></div>`}
function pAna(){const M=[...Array(6)].map((_,i)=>{const n=new Date(),s=new Date(n.getFullYear(),n.getMonth()-5+i,1),e=new Date(n.getFullYear(),n.getMonth()-4+i,1),L=db.tx.filter(t=>t.ts>=+s&&t.ts<+e),c=L.filter(t=>t.type==='credit').reduce((a,t)=>a+t.amt,0),p=L.filter(t=>t.type==='payment').reduce((a,t)=>a+t.amt,0),o=db.tx.filter(t=>t.ts<+e).reduce((a,t)=>a+(t.type==='credit'?t.amt:-t.amt),0);return{l:s.toLocaleString('en-IN',{month:'short'}),n:L.length,c,p,o}});
const mx=Math.max(1,...M.flatMap(m=>[m.c,m.p])),h=v=>170*v/mx;
return`<div class="hd"><h1>Monthly Analytics</h1></div><div class="cd"><h3>Credit vs payments, last 6 months</h3><div class="row mu" style="margin-bottom:6px"><span class="cr">■ Credit given</span><span class="pm">■ Payments received</span></div><svg viewBox="0 0 640 225" width="100%" role="img" aria-label="Monthly credit and payments bar chart">${M.map((m,i)=>{const x=30+i*100;return`<rect class="b1" x="${x}" y="${190-h(m.c)}" width="32" height="${h(m.c)}" rx="5" style="animation-delay:${i*.08}s"/><rect class="b2" x="${x+36}" y="${190-h(m.p)}" width="32" height="${h(m.p)}" rx="5" style="animation-delay:${i*.08+.04}s"/><text class="tx" x="${x+34}" y="212" text-anchor="middle">${m.l}</text>`}).join('')}<line class="gl" x1="15" x2="630" y1="190" y2="190"/></svg></div>
<div class="cd"><h3>Monthly summary</h3><div class="sc"><table><tr><th>Month</th><th>Transactions</th><th>Credit</th><th>Received</th><th>Outstanding at month end</th></tr>${M.map(m=>`<tr><td><b>${m.l}</b></td><td>${m.n}</td><td class="cr">${inr(m.c)}</td><td class="pm">${inr(m.p)}</td><td><b>${inr(m.o)}</b></td></tr>`).join('')}</table></div></div>`}
function supList(q){q=q.toLowerCase();const L=db.sup.filter(s=>(s.name+s.phone+s.biz).toLowerCase().includes(q));return L.length?`<div class="sup">${L.map(s=>`<div class="cd"><h3 style="margin-bottom:2px">${esc(s.name)}</h3><p style="font-weight:700">${esc(s.biz||'—')}</p><p class="mu">${s.phone}<br>${esc(s.addr||'—')}</p><div class="row" style="margin-top:12px"><a class="b g sm" href="tel:${s.phone}">Call</a><button class="b g sm" data-act="editSup" data-id="${s.id}">Edit</button></div></div>`).join('')}</div>`:'<p class="mu">No suppliers found.</p>'}
const pSup=()=>`<div class="hd"><h1>Suppliers</h1><button class="b y" data-act="addSup">+ Add supplier</button></div><div class="cd"><input data-sq placeholder="Search by name, business or phone"></div><div id="sl">${supList('')}</div>`;
const pSet=()=>`<div class="hd"><h1>Settings</h1></div><div class="two2"><div class="cd" data-form><h3>Shop profile</h3><label>Shop name</label><input id="ss" value="${esc(db.shop)}"><label>Owner name</label><input id="so" value="${esc(db.user.name)}"><div class="row end"><button class="b y" data-primary data-act="saveShop">Save profile</button></div></div>
<div class="cd" data-form><h3>Change password</h3><label>Current password</label><input id="cp" type="password"><label>New password</label><input id="np" type="password"><div class="row end"><button class="b y" data-primary data-act="chPass">Update password</button></div></div>
<div class="cd" data-form><h3>PIN protection</h3><p class="mu">${db.pin?'PIN lock is on.':'Ask for a 4-digit PIN each time the app opens.'}</p><label>4-digit PIN</label><input id="pin1" type="password" inputmode="numeric" maxlength="4"><div class="row end">${db.pin?'<button class="b g" data-act="rmPin">Remove PIN</button>':''}<button class="b y" data-primary data-act="setPin">Set PIN</button></div></div>
<div class="cd"><h3>Appearance &amp; account</h3><div class="row"><button class="b g" data-act="theme">Switch light / dark mode</button><button class="b g" data-act="reset">Restore demo data</button><button class="b r" data-act="logout">Log out</button></div></div></div>`;
function custModal(id){const c=id?cust(id):{name:'',phone:''};openModal(id?'Edit customer':'Add customer',`<label>Name</label><input id="mn" value="${esc(c.name)}"><label>Mobile number</label><input id="mp" inputmode="numeric" maxlength="10" value="${c.phone}"><div class="row end"><button class="b g" data-act="close">Cancel</button><button class="b y" data-primary data-act="saveCust" data-id="${id||''}">Save</button></div>`)}
function supModal(id){const s=id?db.sup.find(x=>x.id===id):{name:'',phone:'',biz:'',addr:''};openModal(id?'Edit supplier':'Add supplier',`<label>Name</label><input id="sn" value="${esc(s.name)}"><label>Phone</label><input id="sp" inputmode="numeric" maxlength="10" value="${s.phone}"><label>Business name</label><input id="sb" value="${esc(s.biz)}"><label>Address</label><input id="sa" value="${esc(s.addr)}"><div class="row end"><button class="b g" data-act="close">Cancel</button><button class="b y" data-primary data-act="saveSup" data-id="${id||''}">Save</button></div>`)}
const acts={close:closeM,
mode(){mode=mode==='reg'?'in':'reg';render()},
demo(){mode='in';render();$('#li').value='demo@kirana.in';$('#lp').value='demo123'},
login(){const e=$('#li').value.trim().toLowerCase();if(e!==db.user.email||$('#lp').value!==db.user.pass)return toast('Wrong email or password',1);db.in=true;unlocked=true;save();location.hash='dashboard'},
reg(){const n=$('#rn').value.trim(),s=$('#rs').value.trim(),e=$('#li').value.trim().toLowerCase(),p=$('#lp').value;if(n.length<2||s.length<2)return toast('Enter owner and shop name',1);if(!/^\S+@\S+\.\S+$/.test(e))return toast('Enter a valid email',1);if(p.length<4)return toast('Password needs 4+ characters',1);db={user:{name:n,email:e,pass:p},shop:s,customers:[],tx:[],sup:[],theme:db.theme,pin:'',in:true};unlocked=true;save();location.hash='dashboard'},
logout(){db.in=false;unlocked=false;save();location.hash='login'},
unlock(){if($('#up').value!==db.pin)return toast('Wrong PIN',1);unlocked=true;render()},
theme(){const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');db.theme=cur==='dark'?'light':'dark';applyTheme();save()},
print(){window.print()},
addCust(){custModal()},editCust(a){custModal(a.dataset.id)},
saveCust(a){const id=a.dataset.id,n=$('#mn').value.trim(),p=$('#mp').value.trim();if(n.length<2)return toast('Enter the customer’s name',1);if(!/^\d{10}$/.test(p))return toast('Mobile number must be 10 digits',1);if(db.customers.some(c=>c.phone===p&&c.id!==id))return toast('This mobile number already exists',1);if(id){const c=cust(id);c.name=n;c.phone=p}else db.customers.push({id:uid(),name:n,phone:p});save();closeM();toast('Customer saved');render()},
delCust(a){const c=cust(a.dataset.id);openModal('Delete customer?',`<p>This removes <b>${esc(c.name)}</b> and all their ledger entries. It cannot be undone.</p><div class="row end"><button class="b g" data-act="close">Cancel</button><button class="b r" data-act="doDel" data-id="${c.id}">Delete</button></div>`)},
doDel(a){const id=a.dataset.id;db.customers=db.customers.filter(c=>c.id!==id);db.tx=db.tx.filter(t=>t.cid!==id);save();closeM();toast('Customer deleted');if(location.hash.startsWith('#customer-'))location.hash='customers';else render()},
addTx(a){const cid=a.dataset.id||$('#ec').value,ty=$('#et').value,e=tx(cid,ty,+$('#ea').value,$('#en').value.trim());if(e)return toast(e,1);toast(ty==='credit'?'Udhar recorded':'Payment recorded');render()},
pay(){const e=tx($('#pc').value,'payment',+$('#pa').value,$('#pn').value.trim());if(e)return toast(e,1);toast('Payment recorded');render()},
settle(){$('#pa').value=Math.max(bal($('#pc').value),0)||''},
addSup(){supModal()},editSup(a){supModal(a.dataset.id)},
saveSup(a){const id=a.dataset.id,n=$('#sn').value.trim(),p=$('#sp').value.trim();if(n.length<2)return toast('Enter the supplier name',1);if(!/^\d{10}$/.test(p))return toast('Phone must be 10 digits',1);const v={name:n,phone:p,biz:$('#sb').value.trim(),addr:$('#sa').value.trim()};if(id)Object.assign(db.sup.find(s=>s.id===id),v);else db.sup.push({id:uid(),...v});save();closeM();toast('Supplier saved');render()},
saveShop(){const s=$('#ss').value.trim(),o=$('#so').value.trim();if(!s||!o)return toast('Both fields are required',1);db.shop=s;db.user.name=o;save();toast('Profile saved');render()},
chPass(){if($('#cp').value!==db.user.pass)return toast('Current password is wrong',1);if($('#np').value.length<4)return toast('New password needs 4+ characters',1);db.user.pass=$('#np').value;save();toast('Password updated');render()},
setPin(){const v=$('#pin1').value;if(!/^\d{4}$/.test(v))return toast('PIN must be exactly 4 digits',1);db.pin=v;save();toast('PIN set');render()},
rmPin(){db.pin='';save();toast('PIN removed');render()},
reset(){const t=db.theme;db=seed();db.theme=t;db.in=true;unlocked=true;save();toast('Demo data restored');render()}};
function render(){let h=(location.hash||'').slice(1)||(db.in?'dashboard':'login');
 if(!db.in&&h!=='login'){location.hash='login';return}
 if(db.in&&h==='login'){location.hash='dashboard';return}
 const A=$('#app');
 if(h==='login'){A.innerHTML=pLogin();return}
 if(db.pin&&!unlocked){A.innerHTML=pLock();return}
 const b=h.startsWith('customer-')?pProf(h.slice(9)):({dashboard:pDash,customers:pCust,khata:pKhata,payments:pPay,reports:pRep,analytics:pAna,suppliers:pSup,settings:pSet}[h]||pDash)();
 A.innerHTML=nav(h)+`<main class="pg">${b}</main>`;
 $$('[data-n]').forEach(e=>{const n=+e.dataset.n,c=e.dataset.c==='1',t0=performance.now(),f=t=>{const p=Math.min((t-t0)/800,1),v=n*(1-Math.pow(1-p,3));e.textContent=c?inr(v):Math.round(v);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
}
function onIn(e){const t=e.target,d=t.dataset;if(!d)return;if('f' in d){F[d.f]=t.value;$('#kl').innerHTML=kList()}else if('q' in d)$('#cl').innerHTML=custTable(t.value);else if('sq' in d)$('#sl').innerHTML=supList(t.value);else if('r' in d){if(R.p!==t.value){R.p=t.value;render()}}else if(t.id==='pc')$('#pdue').textContent=inr(Math.max(bal(t.value),0))}
addEventListener('input',onIn);addEventListener('change',onIn);
addEventListener('hashchange',()=>{scrollTo(0,0);render()});
document.addEventListener('click',e=>{if(e.target.id==='modal')return closeM();const a=e.target.closest('[data-act]');if(a&&acts[a.dataset.act]){if(a.tagName==='A'&&a.dataset.act==='demo')e.preventDefault();acts[a.dataset.act](a)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();const f=e.target.closest&&e.target.closest('[data-form]');if(e.key==='Enter'&&f&&e.target.tagName==='INPUT'){const b=f.querySelector('[data-primary]');if(b)b.click()}});
render();
</script></body></html>
